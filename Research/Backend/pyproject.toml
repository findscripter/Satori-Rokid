[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "satori-rokid-repro"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["opencv-python-headless>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[project.scripts]
satori-repro = "satori_repro.cli:main"

[tool.setuptools.packages.find]
include = ["satori_repro*"]

[tool.setuptools.package-data]
satori_repro = ["data/demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["satori_repro"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
