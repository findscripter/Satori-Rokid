[pytest]
testpaths =
    Research/Backend/tests
    Tools
python_files = test_*.py
pythonpath =
    Research/Backend
    Tools
    Tools/deploy/dispider
addopts = --import-mode=importlib
norecursedirs =
    .*
    __pycache__
    Mark12Ding-Dispider-*
    vendor
    vendors
    third_party
    runtime
    official
    local-metadata
